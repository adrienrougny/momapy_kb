[project]
name = "momapy_kb"
version = "0.1.0"
description = "Momapy maps to KB"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "colorama>=0.4.6",
  "jinja2>=3.1.3",
  "frozendict>=2.4.6",
  "momapy",
  "fieldz-kb[all]",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["notebook>=7.4.7"]
test = [
    "pytest>=8.0",
    "testcontainers[neo4j]>=4.0",
]

[tool.uv.sources]
momapy = { path = "../momapy", editable = true }
fieldz-kb = { path = "../fieldz_kb", editable = true }
