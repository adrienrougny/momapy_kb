[project]
name = "momapy_kb"
version = "0.1.0"
description = "Momapy maps to KB"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = ["colorama>=0.4.6", "jinja2>=3.1.3", "frozendict>=2.4.6"]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "-e file:///${PROJECT_ROOT}/../momapy#egg=momapy",
    "-e file:///home/rougny/code/fieldz_kb#egg=fieldz-kb",
]

[tool.basedpyright]
typeCheckingMode = "off"

[dependency-groups]
dev = [
    "notebook>=7.4.7",
]
