[project]
name = "momapy_kb"
dynamic = ["version"]
description = "Momapy maps to KB"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "colorama>=0.4.6",
  "jinja2>=3.1.3",
  "frozendict>=2.4.6",
  "momapy",
  "fieldz-kb[all]",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["notebook>=7.4.7", "pre-commit>=3.0"]
test = [
    "pytest>=8.0",
    "testcontainers[neo4j]>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-autorefs>=1.0",
    "griffe-fieldz>=0.2",
    "griffe-inherited-docstrings>=1.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>([0-9].*))'

[tool.hatch.build]
exclude = [".venv*", ".tox"]

[tool.hatch.build.targets.wheel]
packages = ["src/momapy_kb"]

[tool.uv.sources]
momapy = { path = "../momapy", editable = true }
fieldz-kb = { path = "../fieldz_kb", editable = true }
