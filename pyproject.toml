[project]
name = "momapy_kb"
dynamic = ["version"]
description = "Momapy maps to KB"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "colorama>=0.4.6",
  "jinja2>=3.1.3",
  "frozendict>=2.4.6",
  "momapy>=0.13.0",
  "fieldz-kb>=0.3.1",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
clingo = ["fieldz-kb[clingo]"]
neo4j = ["fieldz-kb[neo4j]"]
falkordb = ["fieldz-kb[falkordb]"]
falkordblite = ["fieldz-kb[falkordblite]"]
all = ["momapy_kb[clingo,neo4j,falkordb,falkordblite]"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pre-commit>=3.0", "tox>=4.22", "tox-uv>=1.16"]
test = ["pytest>=8.0", "testcontainers[neo4j]>=4.0"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.0",
  "mkdocstrings[python]>=0.24",
  "mkdocs-autorefs>=1.0",
  "mike>=2.1",
  "griffe-fieldz>=0.2",
  "griffe-inherited-docstrings>=1.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>([0-9].*))'

[tool.hatch.build]
exclude = [".venv*", ".tox"]

[tool.hatch.build.targets.wheel]
packages = ["src/momapy_kb"]
