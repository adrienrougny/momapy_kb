name: Tests

on:
  workflow_call:
  push:
    branches:
      - testing
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
        shell: bash
      - name: Install tox
        run: |
          pip install tox tox-uv
        shell: bash
      - name: Run tests with tox
        run: |
          tox -e py310,py311,py312,py313,py314
        shell: bash
        env:
          CI: true
